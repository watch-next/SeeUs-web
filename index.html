<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SeeUs - Discover movies and TV shows">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SeeUs">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>SeeUs</title>


  <style id="splash-screen-style">
    html {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #02031A;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .contain {
      display: block;

      /* Mantém a logo centralizada e limita seu tamanho */
      width: auto;
      height: auto;

      /* Limites responsivos */
      max-width: min(70vw, 500px);
      max-height: 35vh;

      /* Preserva a proporção original */
      object-fit: contain;
    }

    .stretch {
      display: block;
      width: 100%;
      height: 100%;
    }

    .cover {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    /*
   * Garante que a splash ocupe toda a tela
   * e mantenha a imagem perfeitamente centralizada.
   */
    #splash {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 100vw;
      height: 100vh;

      background-color: #02031A;
      z-index: 9999;
    }

    #splash img {
      display: block;

      width: auto;
      height: auto;

      max-width: min(70vw, 500px);
      max-height: 35vh;

      object-fit: contain;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>

  <!--
    Google AdSense loader. Replace YOUR_PUBLISHER_ID with the value from
    your AdSense dashboard (looks like ca-pub-1234567890123456).
    Slot IDs themselves are configured in lib/core/ads/ad_slot.dart,
    not in this file.
  -->
  <script async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-YOUR_PUBLISHER_ID"
    crossorigin="anonymous"></script>
</head>

<body>
  <picture id="splash">
    <source srcset="
      splash/img/light-1x.png 1x,
      splash/img/light-2x.png 2x,
      splash/img/light-3x.png 3x,
      splash/img/light-4x.png 4x
    " media="(prefers-color-scheme: light)">

    <source srcset="
      splash/img/dark-1x.png 1x,
      splash/img/dark-2x.png 2x,
      splash/img/dark-3x.png 3x,
      splash/img/dark-4x.png 4x
    " media="(prefers-color-scheme: dark)">

    <img class="contain" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>






  <script src="https://github.com/corbado/flutter-passkeys/releases/download/2.4.0/bundle.js"></script>


  <flutter-view></flutter-view>
  <script src="flutter_bootstrap.js" async=""></script>


</body>

</html>
